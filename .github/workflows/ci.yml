name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-unit:
    name: Lint + unit tests (no cluster)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight deps (no ray/torch)
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings pyyaml numpy pytest ruff mypy

      - name: Lint
        run: ruff check src tests

      - name: Unit tests (pure logic, no Ray cluster)
        run: |
          PYTHONPATH=src pytest tests -q \
            --ignore=tests/test_integration_serve.py

  integration:
    name: End-to-end Ray Serve integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          # Ray 2.x's proto decoding uses FieldDescriptor.label, removed in the
          # protobuf 5.x descriptor API. Pin <5 as the LAST step so nothing
          # re-resolves it back up (transitive deps otherwise request >=5).
          pip install "protobuf>=3.20,<5.0"

      - name: Run integration test (local Serve, simulated backend)
        env:
          RSA_BACKEND: simulated
        run: PYTHONPATH=src pytest tests/test_integration_serve.py -q
