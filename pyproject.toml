[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-serve-autoscale"
version = "0.1.0"
description = "Multi-model serving on Ray Serve with GPU autoscaling driven by request latency"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhishek Mittal" }]
keywords = ["ray", "ray-serve", "autoscaling", "gpu", "llm-serving", "mlops"]

dependencies = [
    "ray[serve]>=2.9.0,<3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "prometheus-client>=0.19.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
ml = ["torch>=2.1.0", "transformers>=4.38.0", "sentence-transformers>=2.5.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.3.0", "mypy>=1.9.0"]

[project.scripts]
rsa-serve = "ray_serve_autoscale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "B008",   # FastAPI/Serve dependency-injection defaults
    # Keep typing.Optional/Union: pydantic eagerly evaluates field annotations,
    # and PEP 604 `X | None` is not runtime-evaluable on our min target (3.9).
    "UP007",
    "UP045",
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
