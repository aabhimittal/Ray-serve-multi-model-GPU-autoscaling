# Model registry + autoscaling configuration.
#
# Load with:  rsa-serve --config config/models.yaml serve
# or set:     export RSA_CONFIG_FILE=config/models.yaml
#
# Every field maps to ModelConfig / AutoscalerConfig in settings.py. Values not
# set here fall back to the model defaults.

# backend: "simulated" runs everywhere (CPU/CI); "transformers" loads real
# HuggingFace models onto the GPU (needs the `ml` extra + CUDA).
backend: simulated

http_host: 0.0.0.0
http_port: 8000
route_prefix: /

models:
  # `priority` forms strict classes for GPU arbitration: a lower-priority
  # model can never preempt a higher-priority one, however far past its own
  # SLO it is. `cold_start_s` is how far ahead the predictive controller looks.
  - name: sentiment
    task: sentiment
    hf_model_id: distilbert-base-uncased-finetuned-sst-2-english
    num_gpus: 0.25          # 4 replicas share one physical GPU
    num_cpus: 1.0
    min_replicas: 1
    max_replicas: 6
    target_ongoing_requests: 8
    max_ongoing_requests: 16
    simulated_latency_s: 0.03
    latency_slo_ms: 150.0
    priority: 300           # customer-facing: served first under contention
    cold_start_s: 45.0
    cost_per_gpu_hour_usd: 2.5
    shed_at_slo_fraction: 1.5

  - name: summarization
    task: summarization
    hf_model_id: sshleifer/distilbart-cnn-12-6
    num_gpus: 0.5           # larger model, half a GPU each
    num_cpus: 2.0
    min_replicas: 1
    max_replicas: 4
    target_ongoing_requests: 4
    max_ongoing_requests: 8
    simulated_latency_s: 0.15
    latency_slo_ms: 800.0
    priority: 200
    cold_start_s: 90.0      # biggest model: longest to warm, looks furthest ahead
    cost_per_gpu_hour_usd: 2.5

  - name: embedding
    task: embedding
    hf_model_id: sentence-transformers/all-MiniLM-L6-v2
    num_gpus: 0.25
    num_cpus: 1.0
    min_replicas: 1
    max_replicas: 6
    target_ongoing_requests: 16
    max_ongoing_requests: 32
    simulated_latency_s: 0.02
    latency_slo_ms: 120.0
    priority: 100           # batch-ish: first to yield GPUs under contention
    cold_start_s: 30.0
    cost_per_gpu_hour_usd: 2.5

# Custom latency-based supervisory autoscaler.
autoscaler:
  enabled: true
  control_interval_s: 15.0  # how often p95 is sampled and replicas reconsidered
  scale_up_ratio: 0.9       # p95 >= slo*0.9 -> scale out
  scale_down_ratio: 0.4     # p95 <= slo*0.4 -> scale in
  scale_step: 1             # (per-model controller only)
  cooldown_s: 60.0
  min_samples: 20
  predictive: true          # size for the latency replicas will FACE, not the
                            # latency already missed during their cold start
  compute_bound_queue_ratio: 0.3   # below this queue share, replicas can't help
  max_scale_out_step: 4
  max_scale_in_step: 1
  scale_out_confirm_ticks: 2       # a breach must persist, not just spike

# Signal conditioning: what makes the control loop trustworthy.
signals:
  ewma_alpha: 0.4           # lower = smoother, slower to react
  trend_window_s: 90.0      # horizon used to estimate ms/s of latency drift
  staleness_ticks: 3        # identical counters before the feed is deemed dead
  flap_window: 6
  flap_threshold: 3
  flap_deadband_widening: 2.0

# Finite cluster resources the arbiter allocates within.
# total_gpus: 0 disables GPU arbitration (CPU dev boxes and CI).
cluster:
  total_gpus: 0.0
  gpu_headroom_fraction: 0.0
  max_hourly_budget_usd: null

# Request-path protection while new replicas are still cold-starting.
admission:
  enabled: true
  max_queue_depth_per_replica: 32
  error_rate_threshold: 0.5
  breaker_min_requests: 20
  breaker_open_s: 15.0
  breaker_half_open_probes: 3
